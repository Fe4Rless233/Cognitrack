[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitrack"
version = "0.1.0"
description = "EEG cognitive fatigue pipeline for CogniTrack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
